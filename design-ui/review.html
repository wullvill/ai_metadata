<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MetaGraph — 审核工作台</title>
<style>
/* ── Design tokens: modern-minimal ── */
:root {
  --bg:      oklch(99% 0.002 240);
  --surface: oklch(100% 0 0);
  --fg:      oklch(18% 0.012 250);
  --muted:   oklch(54% 0.012 250);
  --border:  oklch(92% 0.005 250);
  --accent:  oklch(58% 0.18 255);
  --accent-soft: oklch(58% 0.18 255 / 0.08);
  --success: oklch(62% 0.16 145);
  --warn:    oklch(72% 0.15 75);
  --danger:  oklch(52% 0.20 25);

  --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
  --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
  --font-mono:    'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --max-width: 1200px;
  --nav-height: 56px;
}

/* ── Reset & base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--fg);
  line-height: 1.5;
  min-height: 100vh;
}

/* ── Nav ── */
.nav {
  position: sticky; top: 0; z-index: 100;
  background: oklch(99% 0.002 240 / 0.82);
  backdrop-filter: blur(16px) saturate(180%);
  border-bottom: 1px solid var(--border);
  height: var(--nav-height);
  display: flex; align-items: center;
}
.nav-inner {
  max-width: var(--max-width); width: 100%; margin: 0 auto;
  padding: 0 24px;
  display: flex; align-items: center; gap: 24px;
}
.nav-logo {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-display); font-weight: 700; font-size: 17px;
  letter-spacing: -0.01em; color: var(--fg); text-decoration: none;
}
.nav-logo svg { color: var(--accent); }
.nav-links { display: flex; gap: 4px; margin-left: auto; }
.nav-link {
  padding: 6px 14px; border-radius: var(--radius-sm);
  font-size: 14px; font-weight: 500; color: var(--muted);
  text-decoration: none; transition: all 0.15s;
}
.nav-link:hover, .nav-link.active { color: var(--fg); background: var(--border); }

/* ── Page header ── */
.page-header {
  max-width: var(--max-width); margin: 0 auto; padding: 32px 24px 20px;
}
.page-header h1 {
  font-family: var(--font-display); font-size: 24px; font-weight: 700;
  letter-spacing: -0.01em; color: var(--fg);
}
.page-header .subtitle {
  font-size: 14px; color: var(--muted); margin-top: 4px;
}

/* ── Search bar ── */
.search-section {
  max-width: var(--max-width); margin: 0 auto; padding: 32px 24px 32px;
}
.search-bar {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 8px 10px;
}
.search-bar:focus-within { border-color: var(--accent); }
.search-bar-row { display: flex; gap: 10px; align-items: center; width: 100%; }
.search-icon { color: var(--muted); flex-shrink: 0; }
.search-input {
  flex: 1; border: none; outline: none; background: transparent;
  font-size: 15px; font-family: var(--font-body); color: var(--fg);
  min-width: 0;
}
.search-input::placeholder { color: var(--muted); }
.filter-bar {
  display: flex; gap: 8px; align-items: center; width: 100%;
  overflow-x: auto; padding-top: 2px;
}
.filter-select-wrap {
  position: relative; display: flex; align-items: center;
}
.filter-select {
  appearance: none;
  padding: 5px 28px 5px 10px;
  border-radius: 20px; border: 1px solid var(--border);
  font-size: 13px; font-weight: 500; cursor: pointer;
  background: transparent; color: var(--muted);
  font-family: var(--font-body);
  transition: all 0.15s; min-width: 0;
}
.filter-select:hover { border-color: var(--accent); color: var(--fg); }
.filter-select.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.filter-select-wrap::after {
  content: ''; position: absolute; right: 10px; top: 50%;
  transform: translateY(-50%); pointer-events: none;
  border-left: 4px solid transparent; border-right: 4px solid transparent;
  border-top: 5px solid currentColor;
}
.filter-sep { width: 1px; background: var(--border); margin: 0 4px; align-self: stretch; }
.filter-group { display: flex; gap: 6px; flex-shrink: 0; }
.filter-chip {
  padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border);
  font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap;
  background: transparent; color: var(--muted); font-family: var(--font-body);
  transition: all 0.15s;
}
.filter-chip:hover { border-color: var(--accent); color: var(--fg); }
.filter-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.conf-range-wrap {
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}
.conf-range-label {
  font-size: 12px; color: var(--muted); white-space: nowrap;
  font-family: var(--font-mono); font-variant-numeric: tabular-nums;
}
.conf-range-slider {
  -webkit-appearance: none; appearance: none;
  width: 100px; height: 4px; border-radius: 2px;
  background: var(--border); outline: none;
}
.conf-range-slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--accent); cursor: pointer; border: 2px solid var(--surface);
  box-shadow: 0 1px 3px oklch(18% 0.012 250 / 0.15);
}
.queue-count {
  font-size: 13px; color: var(--muted); padding-left: 8px;
  flex-shrink: 0; font-family: var(--font-mono); font-variant-numeric: tabular-nums;
}

/* ── Ops bar ── */
.ops-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md);
  flex-wrap: wrap; gap: 10px;
}
.ops-bar-left { display: flex; align-items: center; gap: 12px; }
.ops-count { font-size: 13px; color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
.ops-bar-right { display: flex; align-items: center; gap: 10px; }
.ops-selected { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; display: none; }
.ops-batch-btn {
  padding: 6px 16px; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 600; cursor: pointer;
  border: 1px solid var(--border); background: transparent; color: var(--muted);
  font-family: var(--font-body); transition: all 0.15s; white-space: nowrap;
}
.ops-batch-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.ops-batch-btn.danger { color: var(--danger); border-color: var(--danger); }
.ops-batch-btn.danger:hover:not(:disabled) { background: var(--danger); color: #fff; }
.ops-batch-btn:hover:not(:disabled) { opacity: 0.88; }
.ops-batch-btn:disabled {
  background: transparent; border-color: var(--border); color: var(--muted); cursor: not-allowed; opacity: 0.5;
}
.checkbox-cell { width: 40px; text-align: center; padding: 10px 8px !important; }
.checkbox-cell input[type="checkbox"] {
  width: 15px; height: 15px; cursor: pointer; accent-color: var(--accent); margin: 0;
}
th.checkbox-cell { padding: 12px 8px !important; }

/* ── Table ── */
.table-section {
  max-width: var(--max-width); margin: 0 auto; padding: 0 24px 56px;
}
.table-wrap {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); overflow: hidden;
}
.table-scroll { overflow-x: auto; }
table {
  width: 100%; border-collapse: collapse;
  font-size: 14px; font-variant-numeric: tabular-nums;
}
thead { border-bottom: 2px solid var(--border); }
th {
  text-align: left; padding: 12px 16px; font-size: 12px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted);
  white-space: nowrap; cursor: pointer; user-select: none;
  transition: color 0.15s;
}
th:hover { color: var(--fg); }
th.sorted { color: var(--accent); }
th .sort-arrow { margin-left: 4px; font-size: 10px; }
td { padding: 10px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--bg); }
tr.row-clickable { cursor: pointer; }
.cell-name {
  font-weight: 600; color: var(--accent);
  font-family: var(--font-mono); font-size: 13px;
}
.cell-name:hover { text-decoration: underline; }
.cell-mono { font-family: var(--font-mono); font-size: 13px; }

.tag {
  display: inline-block; padding: 2px 8px; border-radius: 4px;
  font-size: 12px; font-weight: 500;
}
.tag-blue { background: oklch(58% 0.18 255 / 0.1); color: var(--accent); }
.tag-green { background: oklch(62% 0.16 145 / 0.1); color: var(--success); }
.tag-amber { background: oklch(72% 0.15 75 / 0.12); color: oklch(55% 0.13 70); }
.tag-red { background: oklch(52% 0.20 25 / 0.08); color: var(--danger); }
.tag-slate { background: oklch(54% 0.012 250 / 0.08); color: var(--muted); }

.conf-cell { display: flex; align-items: center; gap: 8px; }
.conf-bar {
  width: 48px; height: 5px; border-radius: 3px;
  background: var(--border); overflow: hidden; flex-shrink: 0;
}
.conf-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
.conf-bar-fill.high { background: var(--success); }
.conf-bar-fill.mid { background: oklch(72% 0.15 75); }
.conf-bar-fill.low { background: var(--danger); }
.conf-value { font-family: var(--font-mono); font-size: 13px; font-weight: 600; }

/* ── Empty / Loading / Error ── */
.empty-state { display: none; text-align: center; padding: 64px 24px; color: var(--muted); }
.empty-state svg { opacity: 0.3; margin-bottom: 12px; }
.empty-state p { font-size: 15px; }
.loading-state { display: none; padding: 48px 24px; text-align: center; }
.skeleton {
  background: linear-gradient(90deg, var(--border) 25%, oklch(95% 0.002 240) 50%, var(--border) 75%);
  background-size: 200% 100%; animation: shimmer 1.5s infinite;
  border-radius: var(--radius-sm);
}
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.skeleton-row { display: grid; grid-template-columns: 40px 1fr 100px 80px 80px 100px 1fr 140px; gap: 12px; padding: 12px 16px; }
.skeleton-row .sk { height: 16px; }
.error-state { display: none; text-align: center; padding: 64px 24px; color: var(--muted); }
.error-state p { font-size: 15px; margin-bottom: 16px; }
.error-state .retry-btn {
  padding: 8px 20px; border-radius: var(--radius-sm);
  font-size: 14px; font-weight: 600; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: #fff;
  font-family: var(--font-body);
}

/* ── Toast ── */
.toast-container {
  position: fixed; top: 72px; right: 24px; z-index: 400;
  display: flex; flex-direction: column; gap: 8px;
}
.toast {
  padding: 12px 20px; border-radius: var(--radius-md);
  font-size: 14px; font-weight: 500; color: #fff;
  box-shadow: 0 4px 16px oklch(18% 0.012 250 / 0.12);
  animation: toastIn 0.3s ease-out;
  max-width: 360px;
}
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
@keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

/* ── Detail modal ── */
.detail-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: oklch(18% 0.012 250 / 0.3);
  backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center;
  padding: 24px;
}
.detail-overlay.open { display: flex; }
.detail-panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); width: 100%; max-width: 800px;
  max-height: 85vh; overflow-y: auto;
  box-shadow: 0 20px 60px oklch(18% 0.012 250 / 0.12);
}
.detail-header {
  position: sticky; top: 0; z-index: 10;
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 20px 28px; display: flex; align-items: center; justify-content: space-between;
}
.detail-header h3 { font-family: var(--font-mono); font-size: 18px; font-weight: 700; }
.detail-header .detail-type { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 12px; }
.detail-close {
  width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  border: 1px solid var(--border); background: var(--surface);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: var(--muted); transition: all 0.15s;
}
.detail-close:hover { color: var(--fg); border-color: var(--fg); }

/* Detail tabs */
.detail-tabs {
  display: flex; gap: 0; border-bottom: 1px solid var(--border);
  padding: 0 28px; background: var(--bg);
}
.detail-tab {
  padding: 10px 20px; font-size: 13px; font-weight: 600; cursor: pointer;
  border: none; background: transparent; color: var(--muted);
  font-family: var(--font-body); border-bottom: 2px solid transparent;
  transition: all 0.15s; margin-bottom: -1px;
}
.detail-tab:hover { color: var(--fg); }
.detail-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.detail-body { padding: 24px 28px; }
.detail-section { margin-bottom: 24px; }
.detail-section:last-child { margin-bottom: 0; }
.detail-section-title {
  font-size: 12px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.04em; color: var(--muted); margin-bottom: 12px;
}

/* Structured detail list */
.detail-list {
  border: 1px solid var(--border); border-radius: var(--radius-md);
  overflow: hidden;
}
.detail-row-flex {
  display: flex; padding: 12px 20px; border-bottom: 1px solid var(--border);
  font-size: 14px; background: var(--surface); align-items: baseline;
}
.detail-row-flex:last-child { border-bottom: none; }
.detail-label-sm { width: 100px; color: var(--muted); flex-shrink: 0; font-size: 13px; }
.detail-value-sm { flex: 1; font-size: 14px; color: var(--fg); font-weight: 500; }

/* Side-by-side comparison */
.compare-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
}
.compare-card {
  border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: 16px; background: var(--bg);
}
.compare-card h4 { font-size: 13px; font-weight: 600; margin-bottom: 12px; color: var(--muted); }
.compare-card .field { margin-bottom: 10px; }
.compare-card .field:last-child { margin-bottom: 0; }
.compare-card .field-label { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.compare-card .field-value { font-size: 14px; color: var(--fg); }
.compare-card .field-value input,
.compare-card .field-value textarea {
  width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: 14px; font-family: var(--font-body); color: var(--fg);
  background: var(--surface); resize: vertical;
}
.compare-card .field-value input:focus,
.compare-card .field-value textarea:focus { outline: none; border-color: var(--accent); }

/* Quality rules */
.quality-rule {
  display: flex; align-items: center; gap: 8px; padding: 6px 0;
  font-size: 13px;
}
.quality-rule .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.quality-rule .dot.pass { background: var(--success); }
.quality-rule .dot.warn { background: var(--warn); }
.quality-rule .dot.fail { background: var(--danger); }

/* Reference list */
.ref-item {
  display: flex; align-items: center; gap: 12px; padding: 8px 0;
  border-bottom: 1px solid var(--border); font-size: 13px;
}
.ref-item:last-child { border-bottom: none; }
.ref-item .ref-name { font-family: var(--font-mono); font-weight: 600; min-width: 120px; }
.ref-item .ref-desc { color: var(--muted); flex: 1; }
.ref-item .ref-sim {
  font-family: var(--font-mono); font-size: 12px; font-weight: 600;
  padding: 2px 6px; border-radius: 4px;
}

/* Columns table in detail */
.detail-cols-wrap {
  border: 1px solid var(--border); border-radius: var(--radius-md);
  overflow-x: auto;
}
.detail-cols-table {
  width: 100%; border-collapse: collapse;
  font-size: 13px; table-layout: auto;
}
.detail-cols-table thead { position: sticky; top: 0; z-index: 1; }
.detail-cols-table th {
  background: oklch(97% 0.003 250);
  padding: 8px 10px; text-align: left;
  font-size: 11px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.03em;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.detail-cols-table td {
  padding: 8px 10px; border-bottom: 1px solid var(--border);
  vertical-align: top; line-height: 1.5;
}
.detail-cols-table tbody tr:last-child td { border-bottom: none; }
.detail-cols-table tbody tr:hover { background: oklch(58% 0.18 255 / 0.02); }
.detail-cols-table .col-name {
  font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--fg);
}
.detail-cols-table .col-type {
  font-family: var(--font-mono); font-size: 11px; color: var(--muted);
  background: oklch(54% 0.012 250 / 0.06); padding: 2px 6px; border-radius: 3px;
  white-space: nowrap;
}
.detail-cols-table .cell-desc {
  font-size: 13px; color: var(--fg); max-width: 180px;
}
.detail-cols-table .cell-tags {
  display: flex; flex-wrap: wrap; gap: 3px; min-width: 80px;
}
.detail-cols-table .cell-empty {
  color: var(--muted); font-style: italic; font-size: 12px;
}
.detail-cols-table .cell-time {
  font-family: var(--font-mono); font-size: 11px; color: var(--muted); white-space: nowrap;
}
.detail-cols-table input.col-edit {
  width: 100%; padding: 4px 6px; border: 1px solid var(--border);
  border-radius: 4px; font-size: 12px; font-family: var(--font-body);
  color: var(--fg); background: var(--surface);
}
.detail-cols-table input.col-edit:focus {
  outline: none; border-color: var(--accent);
}
.col-edit-dirty { border-color: var(--warn) !important; }
.col-no-columns {
  text-align: center; padding: 32px 24px; color: var(--muted); font-size: 13px;
}

/* Detail footer actions */
.detail-footer {
  position: sticky; bottom: 0; z-index: 10;
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 16px 28px; display: flex; gap: 10px; justify-content: flex-end;
}
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 20px; border-radius: var(--radius-sm);
  font-size: 14px; font-weight: 600; cursor: pointer;
  border: none; font-family: var(--font-body); transition: all 0.15s;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) { opacity: 0.88; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary { background: transparent; color: var(--fg); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
.btn-danger:hover { background: var(--danger); color: #fff; }

/* ── Confirm / Reject dialogs ── */
.dialog-overlay {
  position: fixed; inset: 0; z-index: 300;
  background: oklch(18% 0.012 250 / 0.3);
  backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center;
  padding: 24px;
}
.dialog-overlay.open { display: flex; }
.dialog {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); width: 100%; max-width: 440px;
  padding: 28px;
  box-shadow: 0 20px 60px oklch(18% 0.012 250 / 0.12);
}
.dialog h4 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
.dialog p { font-size: 14px; line-height: 1.6; margin-bottom: 20px; color: var(--muted); }
.dialog textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); font-size: 14px; font-family: var(--font-body);
  color: var(--fg); background: var(--bg); resize: vertical; min-height: 80px;
  margin-bottom: 8px;
}
.dialog textarea:focus { outline: none; border-color: var(--accent); }
.dialog .field-error { font-size: 12px; color: var(--danger); margin-bottom: 12px; display: none; }
.dialog-actions { display: flex; gap: 10px; justify-content: flex-end; }

/* ── Progress bar ── */
.progress-overlay {
  position: fixed; inset: 0; z-index: 350;
  background: oklch(18% 0.012 250 / 0.3);
  backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center;
  padding: 24px;
}
.progress-overlay.open { display: flex; }
.progress-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); width: 100%; max-width: 380px;
  padding: 32px; text-align: center;
  box-shadow: 0 20px 60px oklch(18% 0.012 250 / 0.12);
}
.progress-card p { font-size: 15px; font-weight: 600; margin-bottom: 16px; }
.progress-bar-wrap {
  height: 6px; border-radius: 3px; background: var(--border);
  overflow: hidden; margin-bottom: 8px;
}
.progress-bar-fill {
  height: 100%; border-radius: 3px; background: var(--accent);
  transition: width 0.3s;
}

      {name:"account_id",type:"bigint",origDesc:"账户ID",origTag:"外键",compDesc:"关联dim_account.account_id",compTag:"外键",compTime:"2026-05-18 04:20"},
      {name:"flow_type",type:"varchar(16)",origDesc:"流水类型",origTag:"维度",compDesc:"TRANSFER/INTEREST/FEE/DIVIDEND/TAX",compTag:"维度,枚举",compTime:"2026-05-18 04:20"},
      {name:"amount",type:"decimal(18,4)",origDesc:"金额",origTag:"指标",compDesc:"流入为正，流出为负",compTag:"指标,金额",compTime:"2026-05-18 04:20"},
      {name:"currency",type:"varchar(3)",origDesc:"币种",origTag:"维度",compDesc:"ISO 4217 货币代码",compTag:"维度",compTime:"2026-05-18 04:20"},
      {name:"flow_date",type:"date",origDesc:"发生日期",origTag:"分区",compDesc:"资金变动日期",compTag:"日期,分区",compTime:"2026-05-18 04:20"},
      {name:"counterparty_account",type:"varchar(64)",origDesc:"对手账户",origTag:"",compDesc:"对手方银行账户号码",compTag:"",compTime:"2026-05-18 04:20"},
      {name:"remark",type:"varchar(256)",origDesc:"摘要",origTag:"",compDesc:"业务摘要说明",compTag:"",compTime:"2026-05-18 04:20"}
    ],
    review_status: "rejected", submitted_at: "2026-05-22 14:00", submitted_by: "AI 补全引擎"
  }
];

/* ── State ── */
let activeStatusFilter = 'pending_review';
let activeTypeFilter = 'all';
let activeSystemFilter = 'all';
let activeDbFilter = 'all';
let activeSchemaFilter = 'all';
let confMin = 0;
let sortField = 'submitted_at';
let sortDir = 'desc';
let selectedIds = new Set();
let currentReview = null;
let editedSuggestions = null;
let isLoading = false;
let hasError = false;

/* ── Filter logic ── */
function getFiltered() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  let list = [...REVIEW_QUEUE];
  list.forEach(r => { if (r.suggestions.confidence >= 0.8) r.review_status = 'approved'; });
  if (activeStatusFilter !== 'all') list = list.filter(r => r.review_status === activeStatusFilter);
  if (activeTypeFilter !== 'all') list = list.filter(r => r.entity_type === activeTypeFilter);
  if (activeSystemFilter !== 'all') list = list.filter(r => r.system === activeSystemFilter);
  if (activeDbFilter !== 'all') list = list.filter(r => r.database === activeDbFilter);
  if (activeSchemaFilter !== 'all') list = list.filter(r => r.schema === activeSchemaFilter);
  list = list.filter(r => r.entity_type !== '字段');
  list = list.filter(r => r.suggestions.confidence >= confMin);
  if (q) {
    list = list.filter(r =>
      r.entity_name.toLowerCase().includes(q) ||
      (r.suggestions.display_name || '').toLowerCase().includes(q) ||
      (r.suggestions.description || '').toLowerCase().includes(q) ||
      (r.suggestions.tags || []).join(' ').toLowerCase().includes(q) ||
      r.system.toLowerCase().includes(q) ||
      r.database.toLowerCase().includes(q)
    );
  }
  list.sort((a, b) => {
    let va, vb;
    if (sortField === 'confidence') { va = a.suggestions.confidence; vb = b.suggestions.confidence; }
    else if (sortField === 'submitted_at') { va = a.submitted_at; vb = b.submitted_at; }
    else if (sortField === 'entity_name') { va = a.entity_name.toLowerCase(); vb = b.entity_name.toLowerCase(); }
    else { va = (a[sortField] || '').toString().toLowerCase(); vb = (b[sortField] || '').toString().toLowerCase(); }
    if (va < vb) return sortDir === 'asc' ? -1 : 1;
    if (va > vb) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });
  return list;
}

/* ── Render table ── */
function renderTable() {
  const list = getFiltered();
  const tbody = document.getElementById('tableBody');
  const empty = document.getElementById('emptyState');
  const table = document.getElementById('reviewTable');
  const count = document.getElementById('queueCount');
  const error = document.getElementById('errorState');
  const loading = document.getElementById('loadingState');
  const emptyText = document.getElementById('emptyText');

  error.style.display = 'none';
  loading.style.display = 'none';

  count.textContent = `${list.length} 条记录`;
  const isEmpty = list.length === 0;
  empty.style.display = isEmpty ? 'block' : 'none';
  table.style.display = isEmpty ? 'none' : '';

  if (activeStatusFilter === 'pending_review') emptyText.textContent = '暂无待审核记录';
  else if (activeStatusFilter === 'approved') emptyText.textContent = '暂无已确认记录';
  else if (activeStatusFilter === 'rejected') emptyText.textContent = '暂无已驳回记录';
  else emptyText.textContent = '暂无审核记录';

  const statusLabels = { pending_review: '待审核', approved: '已确认', rejected: '已驳回' };
  const statusColors = { pending_review: 'amber', approved: 'green', rejected: 'red' };

  tbody.innerHTML = list.map(r => {
    const checked = selectedIds.has(r.review_id) ? ' checked' : '';
    const conf = r.suggestions.confidence;
    const confLevel = conf >= 0.8 ? 'high' : conf >= 0.6 ? 'mid' : 'low';
    const isPending = r.review_status === 'pending_review';
    return `
    <tr class="row-clickable" onclick="openDetail('${r.review_id}')">
      <td class="checkbox-cell" onclick="event.stopPropagation()"><input type="checkbox"${checked} onchange="toggleSelect('${r.review_id}',this.checked)"${isPending ? '' : ' disabled'}></td>
      <td><span class="cell-name">${r.entity_name}</span></td>
      <td><span class="tag tag-slate">${r.entity_type}</span></td>
      <td><span class="cell-mono">${r.database}</span></td>
	      <td><span class="cell-mono">${r.schema}</span></td>
	      <td><span class="cell-mono">${r.system}</span></td>
      <td>
        <div class="conf-cell">
          <div class="conf-bar"><div class="conf-bar-fill ${confLevel}" style="width:${conf*100}%"></div></div>
          <span class="conf-value">${(conf*100).toFixed(0)}%</span>
        </div>
      </td>
      <td><span class="tag tag-${statusColors[r.review_status]}">${statusLabels[r.review_status]}</span></td>
      <td class="cell-mono">${r.submitted_at}</td>
    </tr>
  `}).join('');

  /* Sort indicators */
  document.querySelectorAll('th[data-sort]').forEach(th => {
    const f = th.dataset.sort;
    th.classList.toggle('sorted', f === sortField);
    const arrow = th.querySelector('.sort-arrow');
    if (arrow) arrow.textContent = f === sortField ? (sortDir === 'asc' ? '↑' : '↓') : '';
  });

  renderOpsBar(list);
}

/* ── Filter dropdowns ── */
function renderFilters() {
  const types = ['all', ...new Set(REVIEW_QUEUE.map(r => r.entity_type))];
  const systems = ['all', ...new Set(REVIEW_QUEUE.map(r => r.system))];
  const dbs = ['all', ...new Set(REVIEW_QUEUE.map(r => r.database))];
  const schemas = ['all', ...new Set(REVIEW_QUEUE.map(r => r.schema))];

  document.getElementById('typeFilters').innerHTML = types.map(t =>
    `<button class="filter-chip${activeTypeFilter===t?' active':''}" data-type="${t}" onclick="setTypeFilter('${t}')">${t==='all'?'全部类型':t}</button>`
  ).join('');

  const systemSelect = document.getElementById('systemFilter');
  systemSelect.innerHTML = systems.map(s => `<option value="${s}"${activeSystemFilter===s?' selected':''}>${s==='all'?'全部系统':s}</option>`).join('');
  systemSelect.classList.toggle('active', activeSystemFilter !== 'all');

  const dbSelect = document.getElementById('dbFilter');
  dbSelect.innerHTML = dbs.map(d => `<option value="${d}"${activeDbFilter===d?' selected':''}>${d==='all'?'全部库':d}</option>`).join('');
  dbSelect.classList.toggle('active', activeDbFilter !== 'all');

  const schemaSelect = document.getElementById('schemaFilter');
  schemaSelect.innerHTML = schemas.map(s => `<option value="${s}"${activeSchemaFilter===s?' selected':''}>${s==='all'?'全部Schema':s}</option>`).join('');
  schemaSelect.classList.toggle('active', activeSchemaFilter !== 'all');
}

/* ── Ops bar ── */
function renderOpsBar(list) {
  const total = list.length;
  document.getElementById('opsCount').textContent = `共 ${total} 条`;

  const selectableIds = list.filter(r => r.review_status === 'pending_review').map(r => r.review_id);
  const selCount = [...selectedIds].filter(id => selectableIds.includes(id)).length;

  const selSpan = document.getElementById('selectedCount');
  const approveBtn = document.getElementById('batchApproveBtn');
  const rejectBtn = document.getElementById('batchRejectBtn');

  selSpan.style.display = selCount > 0 ? '' : 'none';
  selSpan.textContent = `已选 ${selCount} 项`;
  approveBtn.disabled = selCount === 0;
  rejectBtn.disabled = selCount === 0;

  document.getElementById('selectAll').checked = selectableIds.length > 0 && selectableIds.every(id => selectedIds.has(id));
}

/* ── Selection ── */
function toggleSelectAll(on) {
  const pendingIds = getFiltered().filter(r => r.review_status === 'pending_review').map(r => r.review_id);
  if (on) { pendingIds.forEach(id => selectedIds.add(id)); }
  else { pendingIds.forEach(id => selectedIds.delete(id)); }
  renderTable();
}

function toggleSelect(id, on) {
  if (on) { selectedIds.add(id); }
  else { selectedIds.delete(id); }
  renderTable();
}

/* ── Detail navigation ── */
function openDetail(reviewId) {
  window.location.href = 'review_detail.html?id=' + reviewId;
}

function switchDetailTab(tab, btn) {
  window._detailTab = tab;
  document.querySelectorAll('.detail-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-info').style.display = tab === 'info' ? '' : 'none';
  document.getElementById('tab-compare').style.display = tab === 'compare' ? '' : 'none';
  document.getElementById('tab-columns').style.display = tab === 'columns' ? '' : 'none';
  document.getElementById('tab-quality').style.display = tab === 'quality' ? '' : 'none';
  document.getElementById('tab-reference').style.display = tab === 'reference' ? '' : 'none';
}

function onSuggestionEdit() {
  const displayName = document.getElementById('editDisplayName')?.value || '';
  const desc = document.getElementById('editDesc')?.value || '';
  const tags = document.getElementById('editTags')?.value || '';

  const orig = currentReview.suggestions;
  const modified = displayName !== orig.display_name || desc !== orig.description || tags !== orig.tags.join(', ');

  const btn = document.getElementById('modifyConfirmBtn');
  if (btn) btn.disabled = !modified;

  if (modified) {
    editedSuggestions = { display_name: displayName, description: desc, tags: tags.split(',').map(t => t.trim()).filter(Boolean) };
  } else {
    editedSuggestions = null;
  }
}

function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('open');
  document.body.style.overflow = '';
  currentReview = null;
  editedSuggestions = null;
  window._columnEdits = null;
}

/* ── Columns tab ── */
function renderColumnsTabContent(r) {
  if (!r.columns || r.columns.length === 0) {
    return `<div class="col-no-columns">该资产类型为「${r.entity_type}」，无列信息可展示</div>`;
  }

  window._columnEdits = window._columnEdits || {};

  const rows = r.columns.map((col, i) => {
    const origTags = (col.origTag || '').split(',').map(t => t.trim()).filter(Boolean);
    const editKey = `col_${i}`;
    const edits = window._columnEdits[editKey] || {};
    const compDescVal = edits.compDesc !== undefined ? edits.compDesc : (col.compDesc || '');
    const compTagVal = edits.compTag !== undefined ? edits.compTag : (col.compTag || '');
    const compDescDirty = edits.compDesc !== undefined && edits.compDesc !== (col.compDesc || '');
    const compTagDirty = edits.compTag !== undefined && edits.compTag !== (col.compTag || '');

    const origTagHtml = origTags.length
      ? origTags.map(t => `<span class="tag tag-slate">${t}</span>`).join('')
      : '<span class="cell-empty">—</span>';

    const compDescHtml = compDescVal
      ? `<input class="col-edit${compDescDirty ? ' col-edit-dirty' : ''}" value="${compDescVal.replace(/"/g,'&quot;')}" data-col="${i}" data-field="compDesc" oninput="onColumnEdit(this)" placeholder="补全描述…">`
      : `<input class="col-edit" value="" data-col="${i}" data-field="compDesc" oninput="onColumnEdit(this)" placeholder="补全描述…">`;

    const compTagHtml = `<input class="col-edit${compTagDirty ? ' col-edit-dirty' : ''}" value="${compTagVal.replace(/"/g,'&quot;')}" data-col="${i}" data-field="compTag" oninput="onColumnEdit(this)" placeholder="补全分类标签…">`;

    const compTimeHtml = col.compTime || '<span class="cell-empty">—</span>';

    return `<tr>
      <td><span class="col-name">${col.name}</span></td>
      <td><span class="col-type">${col.type}</span></td>
      <td><div class="cell-desc">${col.origDesc || '<span class="cell-empty">—</span>'}</div></td>
      <td><div class="cell-tags">${origTagHtml}</div></td>
      <td>${compDescHtml}</td>
      <td>${compTagHtml}</td>
      <td><span class="cell-time">${compTimeHtml}</span></td>
    </tr>`;
  }).join('');

  return `
    <div class="detail-section">
      <div class="detail-section-title">列信息 (${r.columns.length} 列)</div>
      <div class="detail-cols-wrap">
        <table class="detail-cols-table">
          <thead>
            <tr>
              <th>列名</th>
              <th>类型</th>
              <th>原始描述</th>
              <th>原始分类标签</th>
              <th>补全描述</th>
              <th>补全分类标签</th>
              <th>补全时间</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div style="margin-top:12px;display:flex;justify-content:flex-end">
        <button class="btn btn-primary" id="colSaveBtn" disabled onclick="saveColumnEdits()">保存列信息</button>
      </div>
    </div>`;
}

function onColumnEdit(input) {
  const colIdx = parseInt(input.dataset.col);
  const field = input.dataset.field;
  const value = input.value.trim();

  window._columnEdits = window._columnEdits || {};
  const editKey = `col_${colIdx}`;
  if (!window._columnEdits[editKey]) window._columnEdits[editKey] = {};
  window._columnEdits[editKey][field] = value;

  const col = currentReview.columns[colIdx];
  const dirty = (window._columnEdits[editKey].compDesc !== undefined && window._columnEdits[editKey].compDesc !== (col.compDesc || ''))
    || (window._columnEdits[editKey].compTag !== undefined && window._columnEdits[editKey].compTag !== (col.compTag || ''));
  input.classList.toggle('col-edit-dirty', dirty);

  updateColumnSaveBtn();
}

function updateColumnSaveBtn() {
  const btn = document.getElementById('colSaveBtn');
  if (!btn) return;
  const hasEdits = window._columnEdits && Object.values(window._columnEdits).some(edits => {
    return (edits.compDesc !== undefined) || (edits.compTag !== undefined);
  });
  btn.disabled = !hasEdits;
}

function saveColumnEdits() {
  if (!currentReview || !currentReview.columns || !window._columnEdits) return;

  Object.entries(window._columnEdits).forEach(([key, edits]) => {
    const colIdx = parseInt(key.split('_')[1]);
    if (edits.compDesc !== undefined) currentReview.columns[colIdx].compDesc = edits.compDesc;
    if (edits.compTag !== undefined) currentReview.columns[colIdx].compTag = edits.compTag;
    currentReview.columns[colIdx].compTime = new Date().toISOString().replace('T',' ').substring(0,19);
  });

  window._columnEdits = {};
  showToast('列信息已保存', 'success');

  /* Re-render columns tab */
  const tabBody = document.getElementById('tab-columns');
  if (tabBody && currentReview) {
    tabBody.innerHTML = renderColumnsTabContent(currentReview);
  }
}

/* ── Approve flow ── */
function openConfirm() {
  document.getElementById('confirmMessage').textContent =
    `确认采纳「${currentReview.entity_name}」的 AI 补全建议？将回写至 OpenMetadata。`;
  document.getElementById('confirmOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeConfirm() {
  document.getElementById('confirmOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function doApprove() {
  if (currentReview) {
    currentReview.review_status = 'approved';
    showToast('已确认采纳「' + currentReview.entity_name + '」的补全建议', 'success');
  }
  closeConfirm();
  closeDetail();
  selectedIds.clear();
  renderTable();
}

/* ── Modify + confirm flow ── */
function doModifyConfirm() {
  if (!currentReview || !editedSuggestions) return;
  currentReview.suggestions.display_name = editedSuggestions.display_name;
  currentReview.suggestions.description = editedSuggestions.description;
  currentReview.suggestions.tags = editedSuggestions.tags;
  currentReview.review_status = 'approved';
  showToast('已修改并确认「' + currentReview.entity_name + '」的补全建议', 'success');
  closeDetail();
  selectedIds.clear();
  renderTable();
}

/* ── Reject flow ── */
function openReject() {
  document.getElementById('rejectReason').value = '';
  document.getElementById('rejectError').style.display = 'none';
  document.getElementById('rejectOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeReject() {
  document.getElementById('rejectOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function doReject() {
  const reason = document.getElementById('rejectReason').value.trim();
  if (!reason) {
    document.getElementById('rejectError').style.display = 'block';
    return;
  }
  if (currentReview) {
    currentReview.review_status = 'rejected';
    currentReview._reject_reason = reason;
    showToast('已驳回「' + currentReview.entity_name + '」的补全建议', 'success');
  }
  closeReject();
  closeDetail();
  selectedIds.clear();
  renderTable();
}

/* ── Batch approve ── */
function batchApprove() {
  const ids = [...selectedIds].filter(id => REVIEW_QUEUE.find(r => r.review_id === id && r.review_status === 'pending_review'));
  if (ids.length === 0) return;
  document.getElementById('batchConfirmMessage').textContent = `确认批量采纳 ${ids.length} 条补全建议？将回写至 OpenMetadata。`;
  document.getElementById('batchConfirmOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  window._batchIds = ids;
}

function closeBatchConfirm() {
  document.getElementById('batchConfirmOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function doBatchApprove() {
  const ids = window._batchIds || [];
  simulateBatchProgress(ids, 'approve');
  closeBatchConfirm();
}

/* ── Batch reject ── */
function batchReject() {
  const ids = [...selectedIds].filter(id => REVIEW_QUEUE.find(r => r.review_id === id && r.review_status === 'pending_review'));
  if (ids.length === 0) return;
  document.getElementById('batchRejectReason').value = '';
  document.getElementById('batchRejectError').style.display = 'none';
  document.getElementById('batchRejectOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  window._batchIds = ids;
}

function closeBatchReject() {
  document.getElementById('batchRejectOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function doBatchReject() {
  const reason = document.getElementById('batchRejectReason').value.trim();
  if (!reason) {
    document.getElementById('batchRejectError').style.display = 'block';
    return;
  }
  const ids = window._batchIds || [];
  closeBatchReject();
  simulateBatchProgress(ids, 'reject', reason);
}

/* ── Batch progress ── */
function simulateBatchProgress(ids, action, reason) {
  const overlay = document.getElementById('progressOverlay');
  const bar = document.getElementById('progressBar');
  const text = document.getElementById('progressText');
  const title = document.getElementById('progressTitle');

  const label = action === 'approve' ? '批量确认' : '批量驳回';
  title.textContent = `${label}处理中…`;
  bar.style.width = '0%';
  text.textContent = `0 / ${ids.length}`;
  overlay.classList.add('open');

  let done = 0;
  const interval = setInterval(() => {
    done++;
    const pct = (done / ids.length) * 100;
    bar.style.width = pct + '%';
    text.textContent = `${done} / ${ids.length}`;

    const r = REVIEW_QUEUE.find(x => x.review_id === ids[done - 1]);
    if (r) {
      if (action === 'approve') r.review_status = 'approved';
      else { r.review_status = 'rejected'; r._reject_reason = reason; }
    }

    if (done >= ids.length) {
      clearInterval(interval);
      setTimeout(() => {
        overlay.classList.remove('open');
        selectedIds.clear();
        renderFilters();
        renderTable();
        showToast(`${label}完成：${ids.length} 条记录已处理`, 'success');
      }, 400);
    }
  }, 200);
}

/* ── Toast ── */
function showToast(msg, type) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => { toast.remove(); }, 3000);
}

/* ── Loading ── */
function loadQueue() {
  isLoading = true;
  hasError = false;
  document.getElementById('loadingState').style.display = 'block';
  document.getElementById('errorState').style.display = 'none';
  document.getElementById('reviewTable').style.display = 'none';
  document.getElementById('emptyState').style.display = 'none';

  setTimeout(() => {
    isLoading = false;
    /* Simulate 5% error rate */
    if (Math.random() < 0.05) {
      hasError = true;
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('errorState').style.display = 'block';
      return;
    }
    document.getElementById('loadingState').style.display = 'none';
    renderFilters();
    renderTable();
  }, 800);
}

/* ── Filter handlers ── */
function setStatusFilter(v) {
  activeStatusFilter = v;
  if (v !== 'pending_review') {
    document.getElementById('confRange').value = 0;
    confMin = 0;
    document.getElementById('confMinLabel').textContent = '0';
  }
  selectedIds.clear();
  renderFilters();
  renderTable();
}

function setSystemFilter(v) { activeSystemFilter = v; renderFilters(); renderTable(); }
function setDbFilter(v) { activeDbFilter = v; renderFilters(); renderTable(); }
function setSchemaFilter(v) { activeSchemaFilter = v; renderFilters(); renderTable(); }

function setTypeFilter(t) {
  activeTypeFilter = t;
  renderFilters();
  renderTable();
}

function setConfMin(v) {
  confMin = parseInt(v) / 100;
  document.getElementById('confMinLabel').textContent = (confMin * 100).toFixed(0);
  selectedIds.clear();
  renderTable();
}

/* ── Search ── */
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('searchInput').addEventListener('input', renderTable);
});

/* ── Sort ── */
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('th[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
      const f = th.dataset.sort;
      if (sortField === f) { sortDir = sortDir === 'asc' ? 'desc' : 'asc'; }
      else { sortField = f; sortDir = f === 'submitted_at' ? 'desc' : 'asc'; }
      renderTable();
    });
  });
});

/* ── Keyboard ── */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeDetail(); closeConfirm(); closeReject();
    closeBatchConfirm(); closeBatchReject();
  }
});

/* ── Init ── */
loadQueue();
</script>
