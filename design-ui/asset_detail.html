<title>资产详情 — MetaGraph</title>
<style>
/* ── Design tokens ── */
:root {
  --bg:      oklch(99% 0.002 240);
  --surface: oklch(100% 0 0);
  --fg:      oklch(18% 0.012 250);
  --muted:   oklch(54% 0.012 250);
  --border:  oklch(92% 0.005 250);
  --accent:  oklch(58% 0.18 255);
  --accent-soft: oklch(58% 0.18 255 / 0.08);
  --success: oklch(62% 0.16 145);
  --warn:    oklch(72% 0.15 75);

  --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
  --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
  --font-mono:    'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --max-width: 960px;
  --nav-height: 56px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; height: 100%; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--fg);
  line-height: 1.5;
  height: 100%;
  display: flex; flex-direction: column;
}

/* ── Nav ── */
.nav {
  flex-shrink: 0;
  position: sticky; top: 0; z-index: 100;
  background: oklch(99% 0.002 240 / 0.82);
  backdrop-filter: blur(16px) saturate(180%);
  border-bottom: 1px solid var(--border);
  height: var(--nav-height);
  display: flex; align-items: center;
}
.nav-inner {
  max-width: var(--max-width); width: 100%; margin: 0 auto;
  padding: 0 24px;
  display: flex; align-items: center; gap: 16px;
}
.nav-logo {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-display); font-weight: 700; font-size: 17px;
  letter-spacing: -0.01em; color: var(--fg); text-decoration: none;
}
.nav-logo svg { color: var(--accent); }
.nav-back {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 12px; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 500; color: var(--muted);
  text-decoration: none; border: 1px solid var(--border);
  transition: all 0.15s;
}
.nav-back:hover { color: var(--fg); border-color: var(--fg); }

/* ── Main layout: two zones ── */
.main {
  flex: 1; display: flex; flex-direction: column;
  max-width: var(--max-width); width: 100%; margin: 0 auto;
  padding: 0 24px; min-height: 0;
}

/* ── Top zone: compact asset header ── */
.top-zone {
  flex-shrink: 0;
  padding: 20px 0 16px;
  border-bottom: 1px solid var(--border);
}
.top-zone .breadcrumb {
  font-size: 12px; color: var(--muted); margin-bottom: 4px;
}
.top-zone .breadcrumb a { color: var(--accent); text-decoration: none; }
.top-zone .breadcrumb a:hover { text-decoration: underline; }
.top-zone .asset-name {
  font-family: var(--font-mono); font-size: 22px; font-weight: 700;
  letter-spacing: -0.01em; margin-bottom: 4px;
}
.top-zone .asset-subtitle {
  font-size: 13px; color: var(--muted); font-family: var(--font-mono);
  margin-bottom: 8px;
}
.top-zone .asset-desc {
  font-size: 14px; line-height: 1.6; color: var(--fg);
  margin-bottom: 10px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.top-zone .badge-row {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
}

/* ── Bottom zone: tabbed detail ── */
.bottom-zone {
  flex: 1; display: flex; flex-direction: column;
  min-height: 0; padding-bottom: 32px;
}
.tab-bar {
  flex-shrink: 0;
  display: flex; gap: 0;
  border-bottom: 2px solid var(--border);
  padding-top: 12px;
}
.tab-btn {
  padding: 8px 20px; font-size: 14px; font-weight: 500;
  color: var(--muted); cursor: pointer;
  border: none; background: none;
  font-family: var(--font-body);
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: all 0.15s;
}
.tab-btn:hover { color: var(--fg); }
.tab-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}
.tab-panel {
  flex: 1; overflow-y: auto; min-height: 0;
  padding-top: 20px;
  display: none;
}
.tab-panel.active { display: block; }

/* ── Tags ── */
.tag {
  display: inline-block; padding: 2px 8px; border-radius: 4px;
  font-size: 12px; font-weight: 500; white-space: nowrap;
}
.tag-blue { background: oklch(58% 0.18 255 / 0.1); color: var(--accent); }
.tag-green { background: oklch(62% 0.16 145 / 0.1); color: var(--success); }
.tag-amber { background: oklch(72% 0.15 75 / 0.12); color: oklch(55% 0.13 70); }
.tag-slate { background: oklch(54% 0.012 250 / 0.08); color: var(--muted); }

/* ── Tab 1: detail rows ── */
.info-section-title {
  font-size: 12px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.04em; color: var(--muted); margin-bottom: 12px; margin-top: 24px;
}
.info-section-title:first-child { margin-top: 0; }
.detail-list {
  border: 1px solid var(--border); border-radius: var(--radius-md);
  overflow: hidden;
}
.detail-row {
  display: flex; padding: 12px 20px; border-bottom: 1px solid var(--border);
  font-size: 14px; background: var(--surface); align-items: baseline;
}
.detail-row:last-child { border-bottom: none; }
.detail-label { width: 110px; color: var(--muted); flex-shrink: 0; font-size: 13px; }
.detail-value { flex: 1; font-size: 14px; color: var(--fg); font-weight: 500; }
.detail-value.mono { font-family: var(--font-mono); font-size: 13px; }

.tags-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }

/* ── Buttons ── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 18px; border-radius: var(--radius-sm);
  font-size: 14px; font-weight: 600; cursor: pointer;
  border: none; text-decoration: none; transition: all 0.15s;
  font-family: var(--font-body);
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { opacity: 0.88; }
.btn-secondary { background: transparent; color: var(--fg); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }

/* ── Tab 2: columns table ── */
.cols-table-wrap {
  border: 1px solid var(--border); border-radius: var(--radius-md);
  overflow: hidden;
}
.cols-table {
  width: 100%; border-collapse: collapse;
  font-size: 13px; table-layout: auto;
}
.cols-table thead { position: sticky; top: 0; z-index: 1; }
.cols-table th {
  background: oklch(97% 0.003 250);
  padding: 10px 14px; text-align: left;
  font-size: 11px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.03em;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.cols-table td {
  padding: 10px 14px; border-bottom: 1px solid var(--border);
  vertical-align: top; line-height: 1.5;
}
.cols-table tbody tr:last-child td { border-bottom: none; }
.cols-table tbody tr:hover { background: oklch(58% 0.18 255 / 0.02); }

.cols-table .col-name {
  font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--fg);
}
.cols-table .col-type {
  font-family: var(--font-mono); font-size: 12px; color: var(--muted);
  background: oklch(54% 0.012 250 / 0.06); padding: 2px 6px; border-radius: 3px;
  white-space: nowrap;
}
.cols-table .cell-desc {
  font-size: 13px; color: var(--fg); max-width: 200px;
}
.cols-table .cell-tags {
  display: flex; flex-wrap: wrap; gap: 3px;
}
.cols-table .cell-time {
  font-family: var(--font-mono); font-size: 11px; color: var(--muted); white-space: nowrap;
}
.cols-table .cell-empty {
  color: var(--muted); font-style: italic; font-size: 12px;
}

/* ── Empty state for no columns ── */
.empty-state {
  text-align: center; padding: 48px 24px; color: var(--muted);
}
.empty-state svg { opacity: 0.2; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }

/* ── Error state ── */
.error-state { text-align: center; padding: 80px 24px; color: var(--muted); flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.error-state svg { opacity: 0.3; margin-bottom: 16px; }
.error-state h2 { font-size: 20px; margin-bottom: 8px; color: var(--fg); }
.error-state p { font-size: 15px; margin-bottom: 24px; }

@media (max-width: 640px) {
  .detail-row { flex-direction: column; gap: 2px; padding: 10px 14px; }
  .detail-label { width: auto; }
  .top-zone .asset-name { font-size: 18px; }
  .main { padding: 0 16px; }
  .cols-table { font-size: 12px; }
  .cols-table th, .cols-table td { padding: 8px 10px; }
}
</style>
</head>

const domainColors = { '交易':'blue','风控':'amber','清算':'green','合规':'amber','财务':'green','客户':'blue','产品':'slate','行情':'green','公共':'slate' };
const classColors = { '机密':'amber','内部':'blue','公开':'green' };
const compLabels = { pending:'待补全', processing:'处理中', completed:'已完成' };
const compColors = { pending:'amber', processing:'blue', completed:'green' };

function getParam(name) {
  return new URL(window.location.href).searchParams.get(name);
}

function tagBadge(text, color) {
  return `<span class="tag tag-${color}">${text}</span>`;
}

function switchTab(tabId) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tabBtn' + tabId).classList.add('active');
  document.getElementById('tabPanel' + tabId).classList.add('active');
}

function render() {
  const id = getParam('id');
  const main = document.getElementById('mainContent');

  if (!id) {
    main.innerHTML = `<div class="error-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <h2>缺少资产标识</h2><p>请从资产目录中选择一条资产查看详情。</p>
      <a class="btn btn-secondary" href="meta_search.html">← 返回资产目录</a>
    </div>`;
    document.title = '缺少资产标识 — MetaGraph';
    return;
  }

  const a = ASSETS.find(x => x.id === id);
  if (!a) {
    main.innerHTML = `<div class="error-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <h2>未找到该资产</h2><p>资产「${id.replace(/[<>&"']/g,'')}」不存在或已被移除。</p>
      <a class="btn btn-secondary" href="meta_search.html">← 返回资产目录</a>
    </div>`;
    document.title = '未找到 — MetaGraph';
    return;
  }

  document.title = `${a.name} — MetaGraph`;
  const compClass = compColors[a.completion] || 'slate';
  const compText = compLabels[a.completion] || a.completion;
  const tags = (a.tags || '').split(',').map(t => t.trim()).filter(Boolean);

  main.innerHTML = `
    <!-- ── Top zone: compact header ── -->
    <div class="top-zone">
      <div class="breadcrumb"><a href="meta_search.html">资产目录</a> / ${a.name}</div>
      <div class="asset-name">${a.name}</div>
      <div class="asset-subtitle">${a.type} · ${a.database}.${a.schema}</div>
      <div class="asset-desc">${a.desc}</div>
      <div class="badge-row">
        ${tagBadge(a.type, 'slate')}
        ${tagBadge(a.system, domainColors[a.domain] || 'slate')}
        ${tagBadge(a.domain, domainColors[a.domain] || 'slate')}
        ${tagBadge(a.classification, classColors[a.classification] || 'slate')}
        ${tagBadge(compText, compClass)}
      </div>
    </div>

    <!-- ── Bottom zone: tabs ── -->
    <div class="bottom-zone">
      <div class="tab-bar">
        <button class="tab-btn active" id="tabBtn1" onclick="switchTab(1)">基本信息</button>
        <button class="tab-btn" id="tabBtn2" onclick="switchTab(2)">列信息</button>
      </div>

      <!-- Tab 1: 基本信息 -->
      <div class="tab-panel active" id="tabPanel1">
        <div class="info-section-title">基本信息</div>
        <div class="detail-list">
          <div class="detail-row"><span class="detail-label">名称</span><span class="detail-value mono">${a.name}</span></div>
          <div class="detail-row"><span class="detail-label">类型</span><span class="detail-value">${tagBadge(a.type, 'slate')}</span></div>
          <div class="detail-row"><span class="detail-label">描述</span><span class="detail-value">${a.desc}</span></div>
          <div class="detail-row"><span class="detail-label">所属系统</span><span class="detail-value mono">${a.system}</span></div>
          <div class="detail-row"><span class="detail-label">所属库</span><span class="detail-value mono">${a.database}</span></div>
          <div class="detail-row"><span class="detail-label">Schema</span><span class="detail-value mono">${a.schema}</span></div>
          <div class="detail-row"><span class="detail-label">业务域</span><span class="detail-value">${tagBadge(a.domain, domainColors[a.domain]||'slate')}</span></div>
          <div class="detail-row"><span class="detail-label">分类</span><span class="detail-value">${tagBadge(a.classification, classColors[a.classification]||'slate')}</span></div>

          <div class="detail-row"><span class="detail-label">标签</span><span class="detail-value">${tags.map(t => tagBadge(t, 'slate')).join('')}</span></div>

  if (!a.columns || a.columns.length === 0) {
    return `<div class="empty-state">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
      <p>该资产类型为「${a.type}」，无列信息可展示</p>
    </div>`;
  }

  const rows = a.columns.map(col => {
    const origTags = (col.origTag || '').split(',').map(t => t.trim()).filter(Boolean);
    const compTags = (col.compTag || '').split(',').map(t => t.trim()).filter(Boolean);

    const origTagHtml = origTags.length
      ? origTags.map(t => `<span class="tag tag-slate">${t}</span>`).join('')
      : '<span class="cell-empty">—</span>';

    const compDescHtml = col.compDesc
      ? col.compDesc
      : '<span class="cell-empty">待补全</span>';

    const compTagHtml = compTags.length
      ? compTags.map(t => `<span class="tag tag-blue">${t}</span>`).join('')
      : '<span class="cell-empty">待补全</span>';

    const compTimeHtml = col.compTime
      ? col.compTime
      : '<span class="cell-empty">—</span>';

    return `<tr>
      <td><span class="col-name">${col.name}</span></td>
      <td><span class="col-type">${col.type}</span></td>
      <td><div class="cell-desc">${col.origDesc || '<span class="cell-empty">—</span>'}</div></td>
      <td><div class="cell-tags">${origTagHtml}</div></td>
      <td><div class="cell-desc">${compDescHtml}</div></td>
      <td><div class="cell-tags">${compTagHtml}</div></td>
      <td><span class="cell-time">${compTimeHtml}</span></td>
    </tr>`;
  }).join('');

  return `
    <div class="info-section-title">列信息 (${a.columns.length} 列)</div>
    <div class="cols-table-wrap">
      <table class="cols-table">
        <thead>
          <tr>
            <th>列名</th>
            <th>类型</th>
            <th>原始描述</th>
            <th>原始分类标签</th>
            <th>补全描述</th>
            <th>补全分类标签</th>
            <th>补全时间</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

render();
</script>
</body>
</html>
