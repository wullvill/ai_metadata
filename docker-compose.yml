version: "3.8"

services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DEPLOYMENT_MODE=embedded

  frontend:
    build: ./frontend
    command: npm run dev
    ports:
      - "5173:5173"
    depends_on:
      - backend

  celery-worker:
    build: ./backend
    command: celery -A app.celery_app worker -P solo --loglevel=info
    volumes:
      - ./data:/app/data
    environment:
      - DEPLOYMENT_MODE=embedded
    depends_on:
      - backend
